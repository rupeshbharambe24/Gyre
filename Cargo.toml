[workspace]
resolver = "2"
members = [
    "crates/whirl-common",
    "crates/whirl-sphinx",
    "crates/whirl-fec",
    "crates/whirl-net",
    "crates/whirl-node",
    "crates/whirl-adversary",
    "crates/whirl-shield",
    "crates/whirl-obfs",
    "crates/whirl-endpoint",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rupeshbharambe24/Whirlpool"
authors = ["rupeshbharambe24 <rupeshbharambe2004@gmail.com>"]

[workspace.dependencies]
# The audited Nym Sphinx mix-packet format. We do NOT roll our own onion
# construction (design decision D11).
sphinx-packet = "0.7.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
curve25519-dalek = "5"
reed-solomon-erasure = "6"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
] }

# Slightly smaller, faster release binaries; harmless for a research build.
[profile.release]
lto = "thin"

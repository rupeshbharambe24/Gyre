[workspace]
resolver = "2"
members = [
    "crates/gyre-common",
    "crates/gyre-sphinx",
    "crates/gyre-fec",
    "crates/gyre-net",
    "crates/gyre-node",
    "crates/gyre-adversary",
    "crates/gyre-shield",
    "crates/gyre-obfs",
    "crates/gyre-endpoint",
    "crates/gyre-directory",
    "crates/gyre-pir",
    "crates/gyre-stego",
    "crates/gyre-crowd",
    "crates/gyre-cli",
    "crates/gyre-sim",
    "crates/gyre-benches",
]
# The cargo-fuzz targets are their own workspace: running them needs nightly, so the
# stable toolchain CI uses must never try to build them.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rupeshbharambe24/Gyre"
authors = ["rupeshbharambe24 <rupeshbharambe2004@gmail.com>"]

[workspace.dependencies]
# The audited Nym Sphinx mix-packet format. We do NOT roll our own onion
# construction (design decision D11).
sphinx-packet = "0.7.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
curve25519-dalek = "5"
# RFC 9497 VOPRF — an audited implementation, replacing the hand-rolled construction.
# `ristretto255-ciphersuite` gives the RFC's ristretto255-SHA512 suite. NOTE: this crate
# pins sha2 0.10 / curve25519-dalek 4 internally, so those appear alongside the workspace's
# newer versions. That duplication is the price of not rolling our own crypto (D11).
voprf = { version = "0.5", default-features = false, features = [
    "ristretto255-ciphersuite",
] }
# Only to name the `RngCore`/`CryptoRng` traits that `voprf` requires; the bytes come from
# the OS CSPRNG via `getrandom`, so no randomness is invented here.
rand_core = { version = "0.6", default-features = false }
# Constant-time primitives with proper optimisation barriers. Already in the tree via
# `voprf`; used directly rather than hand-rolling a comparison (D11 applies to the small
# things too — a hand-written fold has no barrier against the compiler short-circuiting it).
subtle = { version = "2", default-features = false }
ed25519-dalek = "3"
reed-solomon-erasure = "6"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
# Statistically-rigorous microbenchmarks (dev-only, used by gyre-benches). Lean
# config: no HTML/plotters or rayon, just the cargo-bench harness + text stats.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
# Property-based testing (dev-only). Generates thousands of inputs per run and
# shrinks any failure to a minimal counterexample. Runs on stable, in CI.
proptest = "1"
# QUIC transport (S5). `ring` is pinned explicitly rather than relying on a default
# provider, so the crypto backend is a deliberate choice rather than whatever resolves.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
] }

# Slightly smaller, faster release binaries; harmless for a research build.
[profile.release]
lto = "thin"

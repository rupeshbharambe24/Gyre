[package]
name = "gyre-shield"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The inbound rotor: moving-target-defense ingress hopping and proof-of-work admission."

[[bin]]
name = "gyre-shield"
path = "src/main.rs"

[features]
# OPT-IN memory-hard admission puzzle (Equi-X, Tor proposal-327). OFF by default so the
# crate stays pure MIT/Apache: the `equix`/`hashx` crates are LGPL-3.0-only, and pulling
# them in is a licence choice for whoever builds with this feature. The default build ships
# the SHA-256 puzzle and never touches LGPL code. See `pow.rs`.
equix = ["dep:equix"]

[dependencies]
gyre-net = { path = "../gyre-net" }
gyre-directory = { path = "../gyre-directory" }
hmac.workspace = true
sha2.workspace = true
voprf.workspace = true
rand_core.workspace = true
getrandom.workspace = true
zeroize.workspace = true
subtle.workspace = true
tokio.workspace = true
thiserror.workspace = true
# LGPL-3.0-only — gated behind the optional `equix` feature above, never in a default build.
equix = { version = "0.7", optional = true }

[dev-dependencies]
proptest = { workspace = true }
ed25519-dalek.workspace = true
